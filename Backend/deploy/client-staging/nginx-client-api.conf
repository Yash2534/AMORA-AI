# /etc/nginx/sites-available/client-api.searchenginemonks.com
# Separate vhost for client-QA staging. Proxies only to 127.0.0.1:5002.
# Does not touch the api.searchenginemonks.com server block.
#
# First install (HTTP only), then: certbot --nginx -d client-api.searchenginemonks.com
# certbot adds the 443 server block and redirect; re-run `nginx -t` before reload.

map $http_upgrade $amora_client_staging_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name client-api.searchenginemonks.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $amora_client_staging_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
